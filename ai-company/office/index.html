<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIカンパニー オフィス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="office.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">♡</span><span id="company"></span></div>
  <div class="updated">最終更新 <span id="updated"></span></div>
</header>

<main>
  <section class="room" id="room" aria-label="オフィス">
    <div class="wainscot"></div>
    <div class="arch a1"><i class="curtain l"></i><i class="curtain r"></i></div>
    <div class="arch a2"><i class="curtain l"></i><i class="curtain r"></i></div>
    <div class="lamp l1"></div><div class="lamp l2"></div><div class="lamp l3"></div>
    <div class="shelf"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="clock"></div>
    <div class="vase">💐</div>
    <div class="rug"></div>
    <div class="bossdesk"><div class="laptop"></div><div class="cup"></div><div class="nameplate">♛ <span id="boss"></span>の席</div></div>
    <div id="staff"></div>
  </section>

  <section class="panels">
    <article class="card">
      <h2>☀️ 今日のやること</h2>
      <ul id="today" class="list"></ul>
    </article>
    <article class="card">
      <h2>✋ 社長の確認待ち <span id="waitCount" class="badge"></span></h2>
      <ul id="waiting" class="list"></ul>
    </article>
    <article class="card">
      <h2>📦 できたもの</h2>
      <ul id="outputs" class="list"></ul>
    </article>
    <article class="card">
      <h2>📝 さいきんの動き</h2>
      <ul id="log" class="list log"></ul>
    </article>
    <article class="card wide">
      <h2>⚡ ワンタップでお願い</h2>
      <p class="hint">押すとお願いの文章がコピーされます。Claude に貼りつけて送ってください。</p>
      <div class="quick" id="quick"></div>
    </article>
  </section>
</main>
<div id="toast" class="toast" role="status"></div>
<script src="office.js"></script>
</body>
</html>
