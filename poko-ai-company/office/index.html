<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ぽこAIカンパニー オフィス</title>
<link rel="stylesheet" href="office.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">🍃</span><span id="company"></span></div>
  <div class="updated">最終更新 <span id="updated"></span></div>
</header>

<main>
  <section class="room" id="room" aria-label="オフィス">
    <div class="window w1"></div><div class="window w2"></div>
    <div class="plant p1">🪴</div><div class="plant p2">🌿</div>
    <div class="bossdesk"><div class="nameplate">👑 <span id="boss"></span>の席</div></div>
    <div id="staff"></div>
  </section>

  <section class="panels">
    <article class="card">
      <h2>☀️ 今日のやること</h2>
      <ul id="today" class="list"></ul>
    </article>
    <article class="card">
      <h2>✋ 社長の確認待ち <span id="waitCount" class="badge"></span></h2>
      <ul id="waiting" class="list"></ul>
    </article>
    <article class="card">
      <h2>📦 できたもの</h2>
      <ul id="outputs" class="list"></ul>
    </article>
    <article class="card">
      <h2>📝 さいきんの動き</h2>
      <ul id="log" class="list log"></ul>
    </article>
    <article class="card wide">
      <h2>⚡ ワンタップでお願い</h2>
      <p class="hint">押すとお願いの文章がコピーされます。Claude に貼りつけて送ってください。</p>
      <div class="quick" id="quick"></div>
    </article>
  </section>
</main>
<div id="toast" class="toast" role="status"></div>
<script src="office.js"></script>
</body>
</html>
